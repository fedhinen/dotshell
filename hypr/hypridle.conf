general {
    lock_cmd = qs ipc -p /usr/share/chillpill-shell call lockscreen lock
    before_sleep_cmd = qs ipc -p /usr/share/chillpill-shell call lockscreen lock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 150 # 2.5min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300 # 5min
    on-timeout = qs ipc -p /usr/share/chillpill-shell call lockscreen lock
}

listener {
    timeout = 330 # 5.5min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800 # 30min
    on-timeout = systemctl suspend
}
