# vim:ft=kitty
## name:     Ayu Mirage
## blurb:    Tema Ayu Mirage para kitty (con extras)

# ============================
#  Colores básicos
# ============================
background              #212733
foreground              #d9d7ce
selection_background     #343f4c
selection_foreground     #212733

# Cursor
cursor                   #ffcc66
cursor_text_color        #212733

# Scrollbar (no existe en catppuccin/kitty, agregado con tonos propios)
scrollbar_handle_color   #6dcbfa
scrollbar_track_color    #191e2a

# Color de URL al pasar el mouse
url_color                #ffcc66

# Bordes de ventana (splits de kitty)
active_border_color      #6dcbfa
inactive_border_color    #686868
bell_border_color        #fad07b

# Barra de título de la ventana del SO
wayland_titlebar_color   system
macos_titlebar_color     system

# ============================
#  Barra de pestañas (tabs)
# ============================
tab_bar_style            powerline
tab_powerline_style      slanted
tab_bar_background       #191e2a
active_tab_foreground    #191e2a
active_tab_background    #ffcc66
inactive_tab_foreground  #d9d7ce
inactive_tab_background  #212733

# ============================
#  Marks (texto marcado)
# ============================
mark1_foreground #191e2a
mark1_background #6dcbfa
mark2_foreground #191e2a
mark2_background #cfbafa
mark3_foreground #191e2a
mark3_background #90e1c6

# ============================
#  16 colores del terminal
# ============================
# negro
color0  #191e2a
color8  #686868
# rojo
color1  #ed8274
color9  #f28779
# verde
color2  #a6cc70
color10 #bae67e
# amarillo
color3  #fad07b
color11 #ffd580
# azul
color4  #6dcbfa
color12 #73d0ff
# magenta
color5  #cfbafa
color13 #d4bfff
# cyan
color6  #90e1c6
color14 #95e6cb
# blanco
color7  #c7c7c7
color15 #ffffff

# ============================
#  Fuente
# ============================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ============================
#  Cursor y ventana
# ============================
cursor_shape             beam
cursor_blink_interval    0.5
window_padding_width     8
hide_window_decorations  no
confirm_os_window_close  0
background_opacity       0.95
dynamic_background_opacity yes

# ============================
#  Rendimiento / scroll
# ============================
scrollback_lines         10000
repaint_delay             10
input_delay                3
sync_to_monitor           yes

# ============================
#  Mouse / campana
# ============================
mouse_hide_wait          3.0
enable_audio_bell         no
visual_bell_duration      0.2

# ============================
#  Integración de shell
# ============================
shell_integration enabled
allow_remote_control yes

# ============================
#  Atajos de teclado (keymap)
# ============================
kitty_mod ctrl+shift

# Pestañas
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+right next_tab
map kitty_mod+left previous_tab
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4

# Splits (ventanas dentro de la pestaña)
map kitty_mod+enter new_window
map kitty_mod+w close_window
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward

# Tamaño de fuente
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+backspace change_font_size all 0

# Copiar / pegar
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# Buscar en scrollback
map kitty_mod+/ search_scrollback

# Recargar configuración
map kitty_mod+f5 load_config_file

# ============================
#  Layouts
# ============================
enabled_layouts splits,tall,fat,grid,horizontal,vertical,stack
map kitty_mod+l next_layout

# Crear splits con la dirección elegida. Se usa Ctrl+Alt para no pisar
# los atajos de fuente que usan Ctrl+Shift.
map ctrl+alt+minus launch --location=hsplit --cwd=current
map ctrl+alt+backslash launch --location=vsplit --cwd=current

# ============================
#  Redimensionar ventanas (splits)
# ============================
map ctrl+alt+h resize_window narrower
map ctrl+alt+l resize_window wider
map ctrl+alt+j resize_window shorter
map ctrl+alt+k resize_window taller
# Reiniciar tamaño a default
map ctrl+alt+0 resize_window reset

# Modo de redimensión interactivo (más cómodo)
map kitty_mod+r start_resizing_window

# ============================
#  Renombrar pestaña o ventana
# ============================
map kitty_mod+alt+t set_tab_title
map kitty_mod+alt+w set_window_title
